<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Ilustrasi abon pepaya dalam kemasan</title>
  <defs>
    <pattern id="serat" width="40" height="30" patternUnits="userSpaceOnUse">
      <rect width="40" height="30" fill="#b9682b"/>
      <path d="M2 8c6-6 12 4 18-2s12 4 18-2M0 22c6-6 12 4 18-2s12 4 18-2" stroke="#e39a4c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M8 15c5-4 10 3 15-1" stroke="#8a4513" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#fdecd8"/>
  <circle cx="120" cy="100" r="130" fill="#fbe0bf"/>
  <ellipse cx="420" cy="512" rx="300" ry="30" fill="#f2d2ad"/>

  <!-- kemasan -->
  <path d="M290 120h240l14 380H276Z" fill="#c9945e"/>
  <path d="M290 120h240l3 40H287Z" fill="#b07c48"/>
  <rect x="300" y="132" width="220" height="8" rx="4" fill="#9c6a3a"/>
  <rect x="318" y="182" width="184" height="58" rx="8" fill="#fff8ee"/>
  <text x="410" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#944700">Abon Pepaya</text>
  <rect x="318" y="262" width="184" height="190" rx="16" fill="url(#serat)" stroke="#a6713f" stroke-width="4"/>
  <path d="M332 278l30 0" stroke="#fff" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>

  <!-- pepaya terbelah -->
  <g transform="translate(170 438) rotate(-18)">
    <ellipse rx="128" ry="74" fill="#6f9a3a"/>
    <ellipse rx="118" ry="64" fill="#f08a24"/>
    <ellipse rx="100" ry="50" fill="#f6a24d"/>
    <ellipse cx="-6" rx="56" ry="24" fill="#e0731a"/>
    <g fill="#2a1a10">
      <circle cx="-40" cy="-6" r="7"/><circle cx="-24" cy="6" r="7"/><circle cx="-10" cy="-8" r="7"/>
      <circle cx="6" cy="7" r="7"/><circle cx="20" cy="-6" r="7"/><circle cx="34" cy="5" r="6"/>
    </g>
  </g>

  <!-- tumpukan abon -->
  <path d="M560 480c-6-40 30-66 62-60 22-26 70-20 82 12 30 4 42 30 34 48Z" fill="url(#serat)"/>
</svg>
