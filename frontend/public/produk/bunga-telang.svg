<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Ilustrasi teh bunga telang dan bunga telang kering</title>
  <defs>
    <linearGradient id="teh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a58cc"/>
      <stop offset="1" stop-color="#2c2a85"/>
    </linearGradient>
    <g id="f">
      <path d="M0 0C-50-6-60-62-20-80 10-92 40-70 34-40 30-16 18-4 0 0Z" fill="#3433a3"/>
      <path d="M0 0C-24-6-30-34-14-46 0-54 14-40 10-24 8-12 4-4 0 0Z" fill="#6c6ad8"/>
      <path d="M0 0C-10-6-12-22-4-30 4-32 8-18 4-8Z" fill="#f5f0ff"/>
      <path d="M0 0C-4 16-2 30 6 40" stroke="#5f7f3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="800" height="600" fill="#e7e7f8"/>
  <circle cx="660" cy="120" r="150" fill="#dcdcf3"/>
  <ellipse cx="400" cy="500" rx="300" ry="30" fill="#cfcfeb"/>

  <!-- piring kecil dan gelas teh -->
  <ellipse cx="430" cy="470" rx="150" ry="34" fill="#ffffff"/>
  <ellipse cx="430" cy="466" rx="110" ry="22" fill="#f1f1fb"/>
  <path d="M346 210h168l-16 250h-136Z" fill="#ffffff" fill-opacity=".55" stroke="#b9b8e6" stroke-width="5"/>
  <path d="M353 260h154l-12 194h-130Z" fill="url(#teh)"/>
  <ellipse cx="430" cy="260" rx="77" ry="10" fill="#7473dc"/>
  <path d="M370 280l-6 140" stroke="#ffffff" stroke-opacity=".5" stroke-width="8" stroke-linecap="round"/>
  <use href="#f" transform="translate(452 262) rotate(150) scale(.55)"/>

  <!-- bunga kering di meja -->
  <use href="#f" transform="translate(190 490) rotate(-20) scale(1.7)"/>
  <use href="#f" transform="translate(250 370) rotate(25) scale(1.4)"/>
  <use href="#f" transform="translate(130 330) rotate(-60) scale(1.3)"/>
  <use href="#f" transform="translate(660 490) rotate(40) scale(1.6)"/>
  <use href="#f" transform="translate(640 350) rotate(-15) scale(1.3)"/>
</svg>
